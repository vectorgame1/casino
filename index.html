<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Токены 🪙</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #0a0a0a;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; height: 100%; width: 100%;
            font-family: 'Segoe UI', sans-serif;
            padding: 4px; margin: 0; overflow: hidden;
            position: fixed; top: 0; left: 0;
            touch-action: none; user-select: none;
        }
        .bg-pattern {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 140, 0, 0.05) 0%, transparent 60%),
                linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            z-index: -1;
        }
        .bg-pattern::before {
            content: ''; position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ffd700' stroke-width='0.5' stroke-opacity='0.15'%3E%3Cpath d='M30 0 L60 30 L30 60 L0 30 Z'/%3E%3Ccircle cx='30' cy='30' r='8'/%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.6;
        }
        .bg-pattern::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, #000 100%);
        }
        .splash {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 60%, #000 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; overflow: hidden;
        }
        .splash::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.12) 0%, transparent 50%);
            animation: splashGlow 4s ease-in-out infinite;
        }
        @keyframes splashGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .splash-content { text-align: center; z-index: 2; padding: 20px; animation: splashFadeIn 1s ease-out; }
        @keyframes splashFadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .splash-coin {
            width: 160px; height: 160px; margin: 0 auto 20px;
            position: relative; perspective: 1000px;
            animation: coinSpin 3s ease-in-out infinite;
        }
        .splash-coin-inner {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            animation: coinRotate 4s linear infinite;
        }
        @keyframes coinRotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        @keyframes coinSpin {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .coin-face {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            backface-visibility: hidden;
            background: radial-gradient(circle at 30% 30%, #fff59d, #ffd700 40%, #b8860b 90%);
            border: 6px solid #8a6d00;
            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.5),
                inset 0 -20px 30px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(255, 215, 0, 0.7),
                0 0 80px rgba(255, 140, 0, 0.4);
        }
        .coin-face.back { transform: rotateY(180deg); }
        .coin-face .coin-letter {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 90px; color: #8a6d00;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 3px 0 #b8860b;
            font-weight: 900;
        }
        .splash-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 78px; color: #ffd700;
            line-height: 0.9; letter-spacing: 8px;
            text-shadow:
                0 0 20px #ffd700, 0 0 40px #ff8c00,
                0 4px 0 #8a6d00, 0 8px 20px rgba(0,0,0,0.8);
            margin: 10px 0;
        }
        .splash-line {
            width: 220px; height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 15px auto;
            box-shadow: 0 0 20px #ffd700;
        }
        .splash-subtitle {
            color: #ffd700; font-size: 14px; opacity: 0.85;
            margin-bottom: 30px; letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
        }
        .splash-btn {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a1a; border: 3px solid #ffd700;
            border-radius: 12px; padding: 16px 50px;
            font-size: 20px; font-weight: 900; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.3);
            animation: btnPulse 1.5s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.9), inset 0 0 30px rgba(255, 255, 255, 0.5); }
        }
        .splash-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #fff59d, #ffd700); }
        .splash-btn:active { transform: scale(0.98); }
        .game-wrap {
            background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
            padding: 10px; border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(255, 215, 0, 0.08);
            position: relative; width: 100%; max-width: 460px;
            min-height: 500px; max-height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; border: 2px solid #ffd700;
        }
        body.tg-mode .game-wrap { height: 100vh; max-height: 100vh; min-height: 0; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; flex-shrink: 0; gap: 6px;
            position: relative; padding-right: 8px; min-height: 36px;
        }
        .title {
            font-family: 'Bebas Neue', sans-serif;
            color: #ffd700; font-size: 18px; letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            position: absolute; left: 50%; transform: translateX(-50%);
            white-space: nowrap;
            background: rgba(0,0,0,0.5); padding: 4px 12px;
            border-radius: 20px; border: 1px solid rgba(255, 215, 0, 0.4);
        }
        .wallet-display {
            font-family: 'Orbitron', sans-serif;
            color: #ffd700; font-size: 13px; font-weight: bold;
            background: rgba(0,0,0,0.7); padding: 6px 12px;
            border-radius: 20px; border: 2px solid #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            z-index: 2;
        }
        .back-btn {
            background: rgba(0,0,0,0.7); color: #ffd700;
            border: 2px solid #ffd700; border-radius: 8px;
            padding: 6px 10px; font-size: 11px; font-weight: bold;
            cursor: pointer; z-index: 3;
        }
        .sound-btn-bottom {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: #ffd700;
            border: 2px solid #ffd700; border-radius: 8px;
            padding: 6px 10px; font-size: 11px; font-weight: bold;
            cursor: pointer; z-index: 20;
        }
        .sound-btn-bottom.on { background: #ffd700; color: #1a1a1a; }
        .screen {
            display: none; flex-direction: column; flex: 1; min-height: 0;
            overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
            padding-bottom: 40px;
        }
        .screen::-webkit-scrollbar { display: none; }
        .screen.active { display: flex; }
        .screen-h2 {
            font-family: 'Bebas Neue', sans-serif;
            color: #ffd700; font-size: 22px; text-align: center;
            margin-bottom: 10px; letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        .main-menu {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; padding: 8px 16px 0;
            align-content: center; justify-items: center;
            position: relative; z-index: 1;
        }
        .game-btn {
            width: 100px; height: 100px;
            background: linear-gradient(145deg, #ffd700, #ff8c00, #b8860b);
            color: #1a1a1a; border: 3px solid #fff59d;
            border-radius: 20px; cursor: pointer;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 4px; transition: all 0.25s;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .game-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.7);
            border-color: #fff;
        }
        .game-btn:active { transform: translateY(-2px) scale(0.98); }
        .game-btn .emoji { font-size: 34px; }
        .game-btn .name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px; letter-spacing: 1px;
            text-align: center; line-height: 1;
        }
        .extra-menu {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 6px; padding: 8px 16px 0;
            margin-bottom: 4px; position: relative; z-index: 1;
        }
        .extra-btn {
            background: linear-gradient(145deg, rgba(255, 215, 0, 0.15), rgba(0, 0, 0, 0.4));
            color: #ffd700;
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 14px; padding: 7px 10px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 12px; letter-spacing: 1px;
            cursor: pointer; transition: all 0.25s;
            display: flex; align-items: center;
            justify-content: space-between; gap: 6px;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        .extra-btn:hover {
            background: linear-gradient(145deg, rgba(255, 215, 0, 0.3), rgba(0, 0, 0, 0.5));
            border-color: #ffd700;
            transform: translateY(-2px);
        }
        .extra-btn .extra-icon { font-size: 18px; }
        .extra-btn .extra-label { flex: 1; text-align: left; font-size: 12px; }
        .extra-btn .extra-value { font-size: 12px; font-family: 'Orbitron', sans-serif; color: #ffd700; font-weight: bold; }
        .bottom-tagline { text-align: center; padding: 10px 0 4px; flex-shrink: 0; position: relative; z-index: 1; }
        .bottom-tagline .main-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px; color: #ffd700; letter-spacing: 3px;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00;
            animation: taglinePulse 2s ease-in-out infinite;
        }
        @keyframes taglinePulse {
            0%, 100% { text-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00; }
            50% { text-shadow: 0 0 25px #ffd700, 0 0 50px #ff8c00, 0 0 70px #ff8c00; }
        }
        .bottom-tagline .sub-text { font-size: 10px; color: rgba(255, 215, 0, 0.5); letter-spacing: 3px; margin-top: 2px; }
        .menu-decor { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .decor-star {
            position: absolute; font-size: 28px; opacity: 0.15;
            animation: decorFloat 4s ease-in-out infinite;
            filter: blur(0.5px);
        }
        @keyframes decorFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
            50% { transform: translateY(-15px) rotate(15deg); opacity: 0.35; }
        }
        .wheel-container {
            position: relative; width: 100%; max-width: 240px;
            aspect-ratio: 1; margin: 6px auto; flex-shrink: 0;
        }
        #wheel { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 40px rgba(255, 215, 0, 0.4); }
        .pointer {
            position: absolute; top: -14px; left: 50%;
            transform: translateX(-50%); font-size: 32px; color: #ffd700;
            z-index: 5; filter: drop-shadow(0 0 10px #ffd700) drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }
        .wheel-center {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 20px; z-index: 4;
            border: 3px solid #1a1a1a; box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }
        .result-box {
            background: rgba(0,0,0,0.6); border-radius: 12px;
            padding: 8px; margin-bottom: 6px; text-align: center;
            min-height: 50px; display: flex; flex-direction: column;
            justify-content: center; border: 1px solid rgba(255, 215, 0, 0.3);
            flex-shrink: 0;
        }
        .result-number { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.8); }
        .result-text { font-size: 12px; color: #ccc; margin-top: 2px; }
        .result-text.win { color: #4ecca3; font-weight: bold; }
        .result-text.lose { color: #ff5252; }
        .section-label { color: #ffd700; font-size: 10px; margin-bottom: 4px; text-align: center; letter-spacing: 1px; opacity: 0.8; flex-shrink: 0; }
        .bet-types { display: flex; gap: 4px; margin-bottom: 6px; flex-shrink: 0; }
        .bet-type {
            flex: 1; padding: 7px 3px; border: 2px solid #333;
            border-radius: 10px; background: rgba(0,0,0,0.5);
            color: white; font-size: 10px; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 1px;
        }
        .bet-type.active { border-color: #ffd700; background: rgba(255, 215, 0, 0.15); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .bet-type .icon { font-size: 16px; }
        .bet-type .mult { font-size: 9px; opacity: 0.7; }
        .bet-type.red { color: #ff5252; }
        .bet-type.black { color: #ddd; }
        .bet-type.green { color: #4ecca3; }
        .bet-type.number { color: #00d2ff; }
        .amount-row { display: flex; gap: 4px; margin-bottom: 6px; align-items: center; flex-shrink: 0; }
        .amount-input {
            flex: 1; padding: 9px 6px; border: 2px solid #333;
            border-radius: 8px; background: rgba(0,0,0,0.6);
            color: #ffd700; font-family: 'Orbitron', sans-serif;
            font-size: 13px; font-weight: bold; text-align: center;
            outline: none; min-width: 0;
        }
        .amount-input:focus { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .amount-btn {
            padding: 9px 10px; border: 2px solid #333;
            border-radius: 8px; background: rgba(0,0,0,0.5);
            color: white; font-size: 11px; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
        }
        .amount-btn:hover { background: rgba(255, 215, 0, 0.15); border-color: #ffd700; }
        .amount-btn.active { border-color: #ffd700; background: rgba(255, 215, 0, 0.2); color: #ffd700; }
        .spin-btn {
            font-family: 'Orbitron', sans-serif;
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a1a; border: 2px solid #fff59d;
            border-radius: 10px; font-size: 15px; font-weight: 900;
            letter-spacing: 1.5px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            flex-shrink: 0; transition: all 0.2s;
        }
        .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6); }
        .spin-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; border-color: #444; }
        .history-list { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; min-height: 22px; flex-shrink: 0; }
        .history-item {
            width: 22px; height: 22px; border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: white;
            font-family: 'Orbitron', sans-serif;
        }
        .history-item.red { background: #e94560; }
        .history-item.black { background: #2d2d44; border: 1px solid #666; }
        .history-item.green { background: #4ecca3; color: #1a1a2e; }
        .bj-table {
            background: linear-gradient(135deg, #0a4d2e, #0d6b3f);
            border: 2px solid #ffd700; border-radius: 14px;
            padding: 10px; margin-bottom: 6px;
            display: flex; justify-content: space-between;
            gap: 8px; min-height: 170px; flex-shrink: 0;
        }
        .bj-side { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .bj-label { color: #ffd700; font-size: 11px; font-weight: bold; font-family: 'Orbitron', sans-serif; }
        .bj-cards { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 60px; }
        .bj-card {
            width: 36px; height: 52px; background: white;
            border-radius: 5px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 13px; font-weight: bold; color: #1a1a2e;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            border: 2px solid #ddd; animation: cardDeal 0.3s ease-out;
        }
        .bj-card.red { color: #e94560; }
        .bj-card .suit { font-size: 15px; }
        .bj-card.hidden-card { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); color: #ffd700; font-size: 20px; border-color: #ffd700; }
        @keyframes cardDeal {
            from { transform: translateY(-20px) rotate(-10deg); opacity: 0; }
            to { transform: translateY(0) rotate(0); opacity: 1; }
        }
        .bj-controls { display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
        .bj-btn { flex: 1; min-width: 60px; padding: 9px 4px; border: none; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .bj-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .bj-btn:not(:disabled):hover { transform: translateY(-2px); }
        .bj-btn.start { background: linear-gradient(135deg, #4ecca3, #16a085); color: white; }
        .bj-btn.hit { background: linear-gradient(135deg, #3498db, #2980b9); color: white; }
        .bj-btn.stand { background: linear-gradient(135deg, #e67e22, #d35400); color: white; }
        .bj-btn.double { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; }
        .slots-machine {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            border-radius: 16px; padding: 16px 12px;
            margin-bottom: 8px; border: 3px solid #ffd700;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 30px rgba(255, 215, 0, 0.3);
            flex-shrink: 0;
        }
        .slots-reels {
            display: flex; gap: 6px; justify-content: center;
            background: #0a0a0a; padding: 10px;
            border-radius: 10px; border: 2px solid #444;
        }
        .reel {
            width: 60px; height: 70px; background: white;
            border-radius: 8px; display: flex;
            align-items: center; justify-content: center;
            font-size: 36px; box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
        }
        .reel.spinning { animation: reelSpin 0.15s linear infinite; }
        @keyframes reelSpin {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
        .slots-payline { text-align: center; color: #ffd700; font-size: 16px; margin-top: 6px; letter-spacing: 3px; }
        .slots-info { color: #ffd700; font-size: 9px; text-align: center; margin-top: 6px; opacity: 0.7; flex-shrink: 0; }
        .coin-container { display: flex; justify-content: center; align-items: center; margin: 15px 0; perspective: 1000px; flex-shrink: 0; }
        .coin { width: 120px; height: 120px; position: relative; transform-style: preserve-3d; transition: transform 2s cubic-bezier(0.4, 0.0, 0.2, 1); }
        .coin-side {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 50px; backface-visibility: hidden;
            background: radial-gradient(circle at 30% 30%, #fff59d, #ffd700, #b8860b);
            border: 5px solid #8a6d00;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 0 30px rgba(255, 215, 0, 0.6);
        }
        .coin-side.tails { transform: rotateY(180deg); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-card { background: rgba(0,0,0,0.6); border: 2px solid rgba(255, 215, 0, 0.4); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-card .stat-label { color: #aaa; font-size: 10px; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
        .stat-card .stat-value { font-family: 'Orbitron', sans-serif; color: #ffd700; font-size: 18px; font-weight: 900; }
        .stats-records { display: flex; flex-direction: column; gap: 6px; }
        .record-item { background: rgba(0,0,0,0.5); border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; color: white; font-size: 12px; border-left: 3px solid #ffd700; }
        .record-item .record-value { font-family: 'Orbitron', sans-serif; color: #ffd700; font-weight: bold; }
